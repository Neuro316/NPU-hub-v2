name: verify

# Type check, the six build guards, and the marketing harnesses with every tamper
# selector (scripts/verify.cjs). No secrets on purpose: a pull request from a fork must
# never be handed production credentials by a workflow it can edit. Nothing here needs
# the network or the database. The contract tests that DO need a database run by hand
# against a Supabase branch (scripts/marketing/contract-211.sql).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # flags-off-parity reads the pre-build base commit with git show
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
